<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | جِوار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="main">
<div class="container auth-wrap">
  <div class="card">
    <h1 style="font-size:2rem">تسجيل الدخول</h1>
    <form id="login-form" class="form" novalidate>
      <div class="field"><label for="phone">رقم الموبايل</label><div class="phone-field"><span class="prefix">+20</span><input type="tel" id="phone" name="phone" inputmode="numeric" placeholder="1012345678" maxlength="13" autocomplete="tel-national" required></div><span class="hint">اكتب الرقم بدون الصفر الأول. مثال: 1012345678</span></div>
      <div class="field"><label for="password">كلمة المرور</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
      <p id="form-error" class="error-text" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-lg">دخول</button>
    </form>
    <p class="hint" style="margin-top:1rem">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً</a></p>
    <div id="mock-hint" class="hint hidden" style="margin-top:1rem">
      <p style="margin:0">وضع التجربة، وأي كلمة مرور تصلح:</p>
      <p style="margin:0">متطوع موثّق: <span class="dir-ltr">1000000001</span></p>
      <p style="margin:0">متطوع قيد المراجعة: <span class="dir-ltr">1111111111</span></p>
      <p style="margin:0">طالب مساعدة: <span class="dir-ltr">1000000002</span></p>
      <p style="margin:0">مدير النظام: <span class="dir-ltr">1000000000</span></p>
    </div>
  </div>
</div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
