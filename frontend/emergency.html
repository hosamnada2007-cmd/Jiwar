<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طلب طوارئ | جِوار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="main">
<div class="container page">
  <div class="notice" style="margin-bottom:1.5rem">اتصل بالإسعاف <a href="tel:123"><strong>123</strong></a> الآن. جِوار يكمّل الإسعاف ولا يغني عنه.</div>
  <h1>اطلب مساعدة</h1>
  <form id="emergency-form" class="stack" novalidate>
    <div class="card">
      <h2 style="font-size:1.5rem">١. ما الحالة؟</h2>
      <div id="type-list" class="choice-grid"><div class="skeleton"></div></div>
    </div>
    <div class="card">
      <h2 style="font-size:1.5rem">٢. أين أنت؟</h2>
      <div class="grid-2" style="margin-bottom:1rem">
        <div class="field"><label for="governorate">المحافظة</label><select id="governorate" name="governorate"></select></div>
        <div class="field"><label for="city">المدينة أو المركز</label><select id="city" name="city" disabled></select></div>
      </div>
      <p class="hint">اختر محافظتك لتقترب الخريطة منها، ثم اضغط على مكان الحالة بدقة، أو استخدم موقعك الحالي.</p>
      <div id="map" class="map" role="application" aria-label="خريطة تحديد الموقع"></div>
      <div class="actions" style="margin-top:1rem">
        <button type="button" id="use-location" class="btn btn-secondary">استخدم موقعي الحالي</button>
        <span id="coords" class="hint" style="align-self:center">لم يتم تحديد الموقع بعد</span>
      </div>
    </div>
    <div class="card">
      <div class="field"><label for="note">ملاحظة قصيرة (اختياري)</label><textarea id="note" name="note" rows="2" maxlength="200" placeholder="مثال: أمام الصيدلية، الطابق الثالث"></textarea></div>
    </div>
    <p id="form-error" class="error-text" role="alert"></p>
    <button type="submit" class="sos sos-wide" id="sos-submit">أرسل طلب الطوارئ</button>
  </form>
</div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/egypt.js"></script>
  <script src="js/emergency.js"></script>
</body>
</html>
